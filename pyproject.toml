[project]
name = "daai-console"
version = "0.1.0a1"
description = "Python SDK for DAAI Console cooperative action governance."
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-DAAI-Alpha"
authors = [
  { name = "DAAI Console" },
]
keywords = ["ai", "governance", "approval", "audit", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "pytest>=8.4.0,<9.0.0",
]

[project.urls]
Homepage = "https://github.com/sanyAlam/daai-console-python"
Repository = "https://github.com/sanyAlam/daai-console-python"
Issues = "https://github.com/sanyAlam/daai-console-python/issues"

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daai_console = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
